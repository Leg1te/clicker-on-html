<!DOCTYPE html>
<html lang="ru">
   <head>
       <meta charset="UTF-8">
       <title>Clicker</title>
   </head>
   <body>
   <h1 id="score"></h1>
   <button id="click">Клик!</button>
   <button id="x2">x2</button>
   <button id="reset">Сброс!</button>
   <button id="autoclicker">автоклекер</button>
   <h1 id="x2_text"></h1>

   <script>
       let score = 0;
       let x2 = 1
       let x2_bull = false;
       let auto = false;
       document.getElementById('score').innerHTML = `Очков: ${score}`;
       document.getElementById('x2').onclick = function () {
           if (x2 <= 1 && score === 100) {
               x2 += 1;
               score -= 100;
               x2_bull = true;
               document.getElementById('score').innerHTML = `Очков: ${score}`;
               document.getElementById("x2_text").innerHTML = `${x2}x куплен`;
           }
           else if (x2_bull === true && x2 === 5) {
               document.getElementById("x2_text").innerHTML = "Неа x5 уже куплен";
           }
           else {
               document.getElementById("x2_text").innerHTML = "Нету 💵💵💵";
           }
       }
       document.getElementById("click").onclick = function () {
           if (x2_bull === false) {
               score += 1
           }
           else if (x2_bull === true) {
               score += x2;
           }
           else {
               score += 1
           }
           document.getElementById('score').innerHTML = `Очков: ${score}`;
       };
       document.getElementById('reset').onclick = function () {
           score = 0;
           document.getElementById('score').innerHTML = `Очков: ${score}`;
           document.getElementById("x2_text").innerHTML = "Сбросил 💵💵💵";
       }
       document.getElementById("autoclicker").onclick = function () {
          if (score >= 500) {
          score -= 500
          auto = true;
          document.getElementById("x2_text").innerHTML = "autoclicker куплен"
          document.getElementById('score').innerHTML = `Очков: ${score}`;
          }
          else {
             document.getElementById("x2_text").innerHTML = "Нету 💵💵💵";
          }
       }
       if (auto === true) {
          while (auto === true) {
             setTimeout(() => {score += x2;}, 1000)
          }
       }
   </script>
   </body>
</html>
